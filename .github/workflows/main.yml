# borrowed from https://github.com/fdch/fd_lib (many thanks fdch!)
name: Cross-Platform Compile and Publish
description: Compiles on multiple platforms and publishes to deken when tags are pushed

on:
  workflow_dispatch:

  push:
    branches:
      - 'externals/moonlib'
      - 'test-ci'

  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest, ubuntu-22.04-arm]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      PDVERSION: pd-0.56-2

    steps:
      - uses: actions/checkout@v6

      # ---- platform-specific setup ----
      - name: setup pd (unix)
        if: matrix.os != 'windows-latest'
        uses: ./.github/actions/setup-pd

      - name: install mac deps
        if: matrix.os == 'macos-latest'
        run: brew install automake autoconf libtool

      - name: setup windows deps
        if: matrix.os == 'windows-latest'
        run: |
          echo "local_short_commands=true" >> $GITHUB_ENV
          git submodule init && git submodule update
          curl -O "http://msp.ucsd.edu/Software/$PDVERSION.msw.zip"
          unzip "$PDVERSION.msw.zip"

      # ---- build ----
      - name: make (unix)
        if: matrix.os != 'windows-latest'
        run: make PDINCLUDEDIR=pure-data/src

      - name: make (windows)
        if: matrix.os == 'windows-latest'
        run: make pdbinpath="$PDVERSION/bin" PDINCLUDEDIR="$PDVERSION/src" CFLAGS=-march=x86-64

      # ---- package ----
      - name: package library
        run: |
          rm -rf build
          make install objectsdir=./build

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: "moonlib-${{ matrix.os }}-build"
          path: 'build/moonlib'
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # || github.ref == 'refs/heads/test-ci'

    steps:
      - uses: actions/checkout@v6

      - name: download all artifacts
        uses: actions/download-artifact@v8

      - name: Pull deken image
        run: docker pull registry.git.iem.at/pd/deken

      - name: create deken packages
        run: |
          ls -la
          for artifact in moonlib-*-build; do
            echo "Packaging $artifact $artifact..."
            docker run --rm \
              --user $(id -u) \
              --volume ${{ github.workspace }}:/deken \
              registry.git.iem.at/pd/deken \
              deken package --name moonlib --version "${{ github.ref_name }}" "$artifact"
          done

      - name: Upload all to deken
        env:
          DEKEN_USERNAME: ${{ secrets.DEKEN_USERNAME }}
          DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
        run: |
          ls -la
          docker run --rm \
            --user $(id -u) \
            --volume ${{ github.workspace }}:/deken \
            --env DEKEN_USERNAME \
            --env DEKEN_PASSWORD \
            registry.git.iem.at/pd/deken \
            sh -c "deken upload *.dek"

